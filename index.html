<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="icon" href="assets/mark.svg">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/colors.css">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/typography.css">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/radius.css">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/effects.css">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/base.css">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/styles.css">
  <script src="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/_ds_bundle.js"></script>
  <style>
    html, body { min-height: 100%; }
    a { color: var(--ink); text-decoration: none; }
    a:hover { opacity: .45; }
  </style>
  <script src="assets/scroll-pill.js"></script>
</helmet>

<div data-screen-label="Landing" style="min-height:100vh;background:var(--bg);font-family:var(--sans);color:var(--ink-body);display:flex;flex-direction:column">

  <header style="display:flex;align-items:center;justify-content:flex-end;padding:clamp(20px,4vw,32px) clamp(20px,4vw,40px);gap:24px;margin-top:{{ safeTop }}">
    <x-import component-from-global-scope="FormattionPlatformDesignSystem_d1b4df.Lockup" height="{{ lockupHeight }}" base="assets/" hint-size="220px,20px"></x-import>
  </header>

  <main style="flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,6vw,64px);align-items:center;max-width:1120px;width:100%;margin:0 auto;padding:clamp(16px,4vw,40px) clamp(20px,4vw,40px) 64px">

    <section style="display:flex;flex-direction:column;max-width:560px">
      <h1 style="font-size:clamp(32px,5vw,44px);font-weight:300;line-height:1.1;letter-spacing:-.01em;color:var(--ink);text-wrap:pretty">The platform for the people doing the work.</h1>
    </section>

    <section aria-label="Log in" style="background:var(--bg2);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:24px;width:100%;max-width:440px;justify-self:end">
      <h2 style="font-size:20px;font-weight:500;color:var(--ink);line-height:1.2">Log in</h2>
      <form style="display:flex;flex-direction:column;gap:16px" onSubmit="{{ onSubmit }}">
        <sc-if value="{{ stepContact }}" hint-placeholder-val="{{ true }}">
          <x-import component-from-global-scope="FormattionPlatformDesignSystem_d1b4df.Input" label="Email or mobile" type="text" placeholder="Email or mobile" value="{{ contact }}" on-change="{{ onContact }}" hint="We'll text or email you a code." hint-size="100%,96px"></x-import>
        </sc-if>
        <sc-if value="{{ stepCode }}" hint-placeholder-val="{{ false }}">
          <x-import component-from-global-scope="FormattionPlatformDesignSystem_d1b4df.Input" label="{{ codeLabel }}" type="text" placeholder="000000" value="{{ code }}" on-change="{{ onCode }}" hint="Lasts 10 minutes." hint-size="100%,96px"></x-import>
        </sc-if>
        <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
          <p style="font-size:14px;color:var(--bad-fg)">{{ errorText }}</p>
        </sc-if>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:4px">
          <sc-if value="{{ stepCode }}" hint-placeholder-val="{{ false }}">
            <x-import component-from-global-scope="FormattionPlatformDesignSystem_d1b4df.Button" variant="text" on-click="{{ onChangeContact }}" hint-size="80px,44px">Change</x-import>
          </sc-if>
          <sc-if value="{{ stepContact }}" hint-placeholder-val="{{ true }}">
            <span></span>
          </sc-if>
          <x-import component-from-global-scope="FormattionPlatformDesignSystem_d1b4df.Button" variant="primary" type="submit" on-click="{{ onSubmit }}" hint-size="120px,44px">{{ submitLabel }}</x-import>
        </div>
      </form>
    </section>

  </main>

  <footer style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(20px,4vw,40px) 28px;font-size:10px;letter-spacing:.1em;color:var(--muted);flex-wrap:wrap">
    <a href="https://formattion.ai" target="_blank" rel="noopener" aria-label="formattion ai" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-12px"><img src="assets/mark.svg" alt="" style="width:20px;height:20px;display:block"></a>
    <div style="display:flex;align-items:center;gap:24px">
      <a href="#" style="color:var(--muted)">PRIVACY</a>
      <a href="#" style="color:var(--muted)">TERMS</a>
      <a href="#" style="color:var(--muted)">SUPPORT</a>
      <x-import component-from-global-scope="FormattionPlatformDesignSystem_d1b4df.ThemeToggle" width="{{ toggleWidth }}" hint-size="46px,46px"></x-import>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;demoFail&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot;}}">
class Component extends DCLogic {
  state = { step: 'contact', contact: '', code: '', error: '', safeTop: 0 };
  componentDidMount() { try { const st = +new URLSearchParams(location.search).get('top') || 0; if (st) this.setState({ safeTop: st }); } catch (e) {} }
  renderVals() {
    const { step, contact, code, error } = this.state;
    const isPhone = /^[\d\s+]+$/.test(contact.trim());
    const stepContact = step === 'contact', stepCode = step === 'code';
    return {
      contact, code, stepContact, stepCode,
      lockupHeight: 18,
      safeTop: 'calc(' + (this.state.safeTop || 0) + 'px + env(safe-area-inset-top, 0px))',
      toggleWidth: 34,
      showError: !!error,
      errorText: error,
      codeLabel: 'Code ' + (isPhone ? 'texted to ' : 'emailed to ') + contact.trim(),
      submitLabel: stepContact ? 'Send code' : 'Log in',
      onContact: e => this.setState({ contact: e.target.value, error: '' }),
      onCode: e => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6), error: '' }),
      onChangeContact: () => this.setState({ step: 'contact', code: '', error: '' }),
      onSubmit: e => {
        e && e.preventDefault && e.preventDefault();
        if (stepContact) {
          const ok = /\S+@\S+\.\S+/.test(contact) || (isPhone && contact.replace(/\D/g, '').length >= 10);
          if (!ok) { this.setState({ error: 'Enter the email or mobile your company registered.' }); return; }
          this.setState({ step: 'code', error: '' });
          return;
        }
        if (code.length !== 6) { this.setState({ error: 'Enter all six digits.' }); return; }
        if (this.props.demoFail) { this.setState({ error: 'That code isn\'t right or has run out. Ask for a new one.' }); return; }
        window.location.href = 'Platform.dc.html';
      }
    };
  }
}
</script>
</body>
</html>
