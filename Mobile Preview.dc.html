<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/colors.css">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/typography.css">
  <link rel="stylesheet" href="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/tokens/base.css">
  <script src="_ds/formattion-platform-design-system-d1b4df47-ea14-4ef5-9abb-b9c5ae14bca7/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--bg); }
    a { color: var(--ink); } a:hover { opacity: .45; }
  </style>
</helmet>
<section style="padding:40px;display:flex;flex-direction:column;gap:28px;font-family:var(--sans);color:var(--ink-body)">
  <div style="display:flex;flex-direction:column;gap:6px">
    <h1 style="font-size:28px;font-weight:300;line-height:1.2;letter-spacing:-.01em;color:var(--ink)">Phone layout</h1>
    <p style="font-size:15px;color:var(--muted);max-width:640px;text-wrap:pretty">Summary is the chosen layout. 1a and 1b are earlier options.</p>
  </div>
  <div style="display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start">
    <sc-for list="{{ variants }}" as="v" hint-placeholder-count="3">
      <div id="{{ v.id }}" style="display:flex;flex-direction:column;gap:16px;max-width:860px">
        <div style="display:flex;align-items:baseline;gap:12px">
          <span style="font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--bg);background:var(--ink);border-radius:6px;padding:4px 8px">{{ v.id }}</span>
          <span style="font-size:20px;font-weight:500;color:var(--ink)">{{ v.name }}</span>
          <span style="font-size:14px;color:var(--muted);text-wrap:pretty">{{ v.note }}</span>
        </div>
        <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
          <sc-for list="{{ v.phones }}" as="p" hint-placeholder-count="2">
            <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
              <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="402px,874px">
                <iframe src="{{ p.src }}" title="{{ p.label }}" style="width:402px;height:874px;border:none;display:block;background:var(--bg)"></iframe>
              </x-import>
              <span style="font-size:14px;color:var(--muted)">{{ p.label }}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const mk = (m) => (s) => 'Platform.dc.html?top=54&m=' + m + '&screen=' + s;
    const set = (m, more) => { const u = mk(m); return [ { label: 'Today', src: u('today') }, { label: 'Project · Meadow Rise', src: u('project&id=meadow') }, ...(more ? [ { label: 'Money', src: u('money') }, { label: 'Operative · Lee Parker', src: u('operative&id=lee') }, { label: 'Equipment · dumper', src: u('unit&id=dumper') }, { label: 'Company', src: u('company') } ] : []) ]; };
    return { variants: [
      { id: '3a', name: 'Log in', note: '', phones: [ { label: 'Landing', src: 'Landing Page.dc.html?top=54' } ] },
      { id: '2a', name: 'Summary', note: '', phones: set('summary', true) },
      { id: '1a', name: 'Panels', note: 'Flat cards, as on desktop.', phones: set('panels') },
      { id: '1b', name: 'Paper', note: 'No boxes, hairlines only.', phones: set('paper') },
      { id: '1c', name: 'Summary', note: 'Closed sections show one line.', phones: set('summary') }
    ] };
  }
}
</script>
</body>
</html>
